    <script>
      // Make desktop nav dropdown open on hover (instead of click only).
      // The existing UI already has click handlers that set the active menu state;
      // we simply trigger those handlers on hover.
      window.addEventListener("load", () => {
        const navCandidates = Array.from(document.querySelectorAll("nav")).filter(
          (n) => n.className.includes("bg-white") && n.className.includes("lg:block")
        );

        const wrappers = navCandidates.flatMap((n) =>
          Array.from(n.querySelectorAll("div.relative.group"))
        );

        // Dropdown panel rendered by the existing UI when activeDropdown matches the nav id.
        const menuSelector = "div.absolute.left-0.top-full";

        // Some nav items navigate immediately on click in your legacy code.
        const exclude = new Set(["services", "offers", "blogs", "new launch", "shops"]);
        const normalize = (s) => (s || "").trim().toLowerCase().replace(/\s+/g, " ");

        const timers = new WeakMap();

        function isVisible(el) {
          if (!el) return false;
          const style = window.getComputedStyle(el);
          if (
            style.display === "none" ||
            style.visibility === "hidden" ||
            style.opacity === "0" ||
            parseFloat(style.opacity || "1") <= 0.01
          )
            return false;
          // getClientRects can still report a box even when opacity is 0,
          // so we combine it with the opacity/visibility checks above.
          const rects = el.getClientRects();
          return rects.length > 0 && rects.some((r) => r.width > 0 && r.height > 0);
        }

        wrappers.forEach((wrapper) => {
          if (wrapper.dataset.hoverBound === "1") return;

          const labeledSpans = Array.from(wrapper.querySelectorAll("span")).filter(
            (s) => normalize(s.textContent).length > 0
          );
          if (labeledSpans.length === 0) return;

          // Pick the first span that looks like a nav label (non-icon text) and is not excluded.
          const clickTarget =
            labeledSpans.find((s) => !exclude.has(normalize(s.textContent))) ||
            labeledSpans[0];

          if (!clickTarget) return;

          wrapper.dataset.hoverBound = "1";

          wrapper.addEventListener("mouseenter", () => {
            const prev = timers.get(wrapper);
            if (prev) window.clearTimeout(prev);
            timers.delete(wrapper);

            // Only click when submenu is not already present/open.
            const menuEl = wrapper.querySelector(menuSelector);
            if (isVisible(menuEl)) return;

            clickTarget.click();
            window.setTimeout(() => {
              const openedEl = wrapper.querySelector(menuSelector);
              if (isVisible(openedEl)) wrapper.dataset.hoverOpen = "1";
            }, 80);
          });

          wrapper.addEventListener("mouseleave", () => {
            const prev = timers.get(wrapper);
            if (prev) window.clearTimeout(prev);

            const t = window.setTimeout(() => {
              if (
                wrapper.dataset.hoverOpen === "1" &&
                isVisible(wrapper.querySelector(menuSelector))
              ) {
                clickTarget.click();
              }
              wrapper.dataset.hoverOpen = "0";
            }, 200);

            timers.set(wrapper, t);
          });
        });
      });
    </script>

    <script>
      (function () {
        var fab = document.getElementById("chatbot-fab");
        var whatsappFab = document.getElementById("whatsapp-fab");
        var panel = document.getElementById("chatbot-panel");
        var closeBtn = document.getElementById("chatbot-close");
        var messages = document.getElementById("chatbot-messages");
        var input = document.getElementById("chatbot-input");
        var sendBtn = document.getElementById("chatbot-send");

        if (!fab || !panel || !messages || !input || !sendBtn) return;
        var backdrop = document.getElementById("chatbot-backdrop");


        // WhatsApp button config (hide if phone is not set).
        if (whatsappFab) {
          var waMeta = document.querySelector('meta[name="macstore-whatsapp"]');
          var waNumber = (waMeta && waMeta.getAttribute("content")) ? String(waMeta.getAttribute("content")).trim() : "";

          // Accept digits with optional leading +; WhatsApp wa.me expects country+number without "+".
          waNumber = waNumber.replace(/^\+/, "");

          if (!waNumber) {
            whatsappFab.style.display = "none";
          } else {
            var PRODUCT_API = "https://admin.macstore.com.np/api";
            var waPathKey = "";

            function getProductSlugFromPath() {
              try {
                var path = window.location && window.location.pathname ? window.location.pathname : "";
                var lower = String(path).toLowerCase();
                if (lower.indexOf("/productview/") === -1) return "";
                var slug = path.split("/productview/")[1] || "";
                slug = slug.split("/")[0] || "";
                slug = slug.split("?")[0] || "";
                return decodeURIComponent(slug).trim();
              } catch (e) {
                return "";
              }
            }

            function formatListedPrice(priceRaw) {
              var n = parseFloat(String(priceRaw || "").replace(/,/g, ""));
              if (isNaN(n)) return "";
              return n.toLocaleString();
            }

            function defaultWaMessage() {
              return (
                "Hi MacStore Nepal! I need help choosing the right Apple product. My budget is NPR ___ and usage is ___."
              );
            }

            function setWaHref(message) {
              whatsappFab.setAttribute(
                "href",
                "https://wa.me/" + waNumber + "?text=" + encodeURIComponent(message)
              );
            }

            function updateWhatsAppLink() {
              var slug = getProductSlugFromPath();
              if (!slug) {
                waPathKey = "";
                setWaHref(defaultWaMessage());
                return;
              }
              if (slug === waPathKey && whatsappFab.getAttribute("href") && whatsappFab.getAttribute("href").indexOf("wa.me/") !== -1) {
                return;
              }
              waPathKey = slug;
              setWaHref(defaultWaMessage());
              fetch(PRODUCT_API + "/products/" + encodeURIComponent(slug), {
                headers: { Accept: "application/json" },
              })
                .then(function (r) {
                  return r.ok ? r.json() : null;
                })
                .then(function (data) {
                  if (!data || !data.product) return;
                  var price = data.product.price;
                  var listed = formatListedPrice(price);
                  if (!listed) return;
                  if (getProductSlugFromPath() !== slug) return;
                  var msg =
                    "Hi MacStore Nepal! I need help choosing the right Apple product. My budget is NPR " +
                    listed +
                    " and usage is ___.";
                  setWaHref(msg);
                })
                .catch(function () {});
            }

            updateWhatsAppLink();

            (function () {
              var _push = history.pushState;
              var _replace = history.replaceState;
              history.pushState = function () {
                var ret = _push.apply(history, arguments);
                updateWhatsAppLink();
                return ret;
              };
              history.replaceState = function () {
                var ret = _replace.apply(history, arguments);
                updateWhatsAppLink();
                return ret;
              };
              window.addEventListener("popstate", updateWhatsAppLink);
            })();
          }
        }

        function escapeHtml(str) {
          return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }

        function linkifyText(text) {
          var s = String(text || "");
          var origin = (window.location && window.location.origin) ? window.location.origin : "";

          // Match:
          // - full URLs (https://...)
          // - absolute product URLs without protocol (example.com/productview/...)
          // - internal product paths (/productview/...)
          // - internal product paths without leading slash (productview/...)
          var urlRegex =
            /(https?:\/\/[^\s<>"']+)|((?:[a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}\/productview\/[^\s<>"']+)|(\/productview\/[^\s<>"']+)|(productview\/[^\s<>"']+)/g;
          var normalize = function (u) {
            // Strip common trailing punctuation.
            var url = String(u).replace(/[)\].,!?;:]+$/g, "");
            if (url.indexOf("productview/") === 0) {
              url = "/" + url;
            }

            // If it's a domain-based product URL without protocol, add https://
            if (
              url.indexOf("http://") !== 0 &&
              url.indexOf("https://") !== 0 &&
              url.indexOf("/productview/") !== 0
            ) {
              // expected format: example.com/productview/slug
              if (/^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}\/productview\//.test(url)) {
                url = "https://" + url;
              }
            }

            return url;
          };

          var out = "";
          var lastIndex = 0;
          var match;

          while ((match = urlRegex.exec(s)) !== null) {
            var start = match.index;
            var end = urlRegex.lastIndex;
            var before = s.slice(lastIndex, start);
            out += escapeHtml(before);

            var rawUrl = match[1] || match[2] || match[3] || match[4] || "";
            var url = normalize(rawUrl);
            var href = url;
            var display = url;

            if (String(url).indexOf("/productview/") === 0) {
              href = origin + url;
            }

            out +=
              '<a class="chatbot-msg-link" href="' +
              escapeHtml(href) +
              '" target="_blank" rel="noreferrer">' +
              escapeHtml(display) +
              "</a>";

            lastIndex = end;
          }

          out += escapeHtml(s.slice(lastIndex));
          return out.replace(/\n/g, "<br>");
        }

        function addMessage(text, role) {
          var wrap = document.createElement("div");
          wrap.className =
            "chatbot-msg-row chatbot-msg-row--" + (role === "user" ? "user" : "bot");
          var rowCount = messages.querySelectorAll(".chatbot-msg-row").length;
          var stagger = Math.min(rowCount * 80, 400);

          var bubble = document.createElement("div");
          bubble.className =
            "chatbot-msg-bubble chatbot-msg-bubble--" +
            (role === "user" ? "user" : "bot");
          bubble.style.setProperty("--chatbot-stagger", stagger + "ms");

          var body = document.createElement("div");
          body.className = "chatbot-msg-body";
          body.innerHTML = linkifyText(text);
          bubble.appendChild(body);

          if (role === "user") {
            var stack = document.createElement("div");
            stack.className = "chatbot-msg-stack chatbot-msg-stack--user";
            var label = document.createElement("span");
            label.className = "chatbot-msg-label chatbot-msg-label--user";
            label.textContent = "You";
            stack.appendChild(label);
            stack.appendChild(bubble);
            wrap.appendChild(stack);
          } else {
            var avatar = document.createElement("div");
            avatar.className = "chatbot-avatar";
            avatar.setAttribute("aria-hidden", "true");
            avatar.textContent = "\uD83E\uDD16";
            var stack = document.createElement("div");
            stack.className = "chatbot-msg-stack";
            var label = document.createElement("span");
            label.className = "chatbot-msg-label";
            label.textContent = "ScriptAI";
            stack.appendChild(label);
            stack.appendChild(bubble);
            wrap.appendChild(avatar);
            wrap.appendChild(stack);
          }

          messages.appendChild(wrap);
          messages.scrollTop = messages.scrollHeight;
          return wrap;
        }

        function addTypingIndicator() {
          var wrap = document.createElement("div");
          wrap.className = "chatbot-msg-row chatbot-msg-row--bot";
          var rowCount = messages.querySelectorAll(".chatbot-msg-row").length;
          var stagger = Math.min(rowCount * 80, 400);

          var avatar = document.createElement("div");
          avatar.className = "chatbot-avatar";
          avatar.setAttribute("aria-hidden", "true");
          avatar.textContent = "\uD83E\uDD16";

          var stack = document.createElement("div");
          stack.className = "chatbot-msg-stack";
          var label = document.createElement("span");
          label.className = "chatbot-msg-label";
          label.textContent = "ScriptAI";

          var bubble = document.createElement("div");
          bubble.className =
            "chatbot-msg-bubble chatbot-msg-bubble--bot chatbot-msg-bubble--typing";
          bubble.style.setProperty("--chatbot-stagger", stagger + "ms");

          var body = document.createElement("div");
          body.className = "chatbot-msg-body";
          body.style.padding = "14px 16px";
          body.innerHTML =
            '<span class="chatbot-typing-dots" aria-label="Bot is typing"><span></span><span></span><span></span></span>';

          bubble.appendChild(body);
          stack.appendChild(label);
          stack.appendChild(bubble);
          wrap.appendChild(avatar);
          wrap.appendChild(stack);

          messages.appendChild(wrap);
          messages.scrollTop = messages.scrollHeight;
          return wrap;
        }

        var welcomeSequenceFinished = false;
        var welcomeSequenceCtl = null;

        function cancelWelcomeSequence() {
          if (!welcomeSequenceCtl) return;
          welcomeSequenceCtl.cancelled = true;
          welcomeSequenceCtl.timers.forEach(function (id) {
            window.clearTimeout(id);
          });
          if (welcomeSequenceCtl.typingRow && welcomeSequenceCtl.typingRow.parentNode) {
            welcomeSequenceCtl.typingRow.remove();
          }
          welcomeSequenceCtl = null;
        }

        function startWelcomeSequenceIfNeeded() {
          if (welcomeSequenceFinished) return;
          if (welcomeSequenceCtl) return;
          var ctl = { cancelled: false, timers: [], typingRow: null };
          welcomeSequenceCtl = ctl;
          ctl.typingRow = addTypingIndicator();
          var typingMs = 950;
          var t0 = window.setTimeout(function () {
            if (ctl.cancelled || welcomeSequenceCtl !== ctl) return;
            if (ctl.typingRow && ctl.typingRow.parentNode) ctl.typingRow.remove();
            ctl.typingRow = null;
            var parts = getPageGreetingParts();
            var staggerMs = 80;
            parts.forEach(function (part, i) {
              var tid = window.setTimeout(function () {
                if (ctl.cancelled || welcomeSequenceCtl !== ctl) return;
                addMessage(part, "bot");
                if (i === parts.length - 1) {
                  welcomeSequenceFinished = true;
                  welcomeSequenceCtl = null;
                }
              }, i * staggerMs);
              ctl.timers.push(tid);
            });
          }, typingMs);
          ctl.timers.push(t0);
        }

        function getChatApiUrl() {
          if (typeof window !== "undefined" && window.__CHATBOT_API_URL__) {
            return String(window.__CHATBOT_API_URL__).trim();
          }
          var m = document.querySelector('meta[name="macstore-chat-api"]');
          var v = m && m.getAttribute("content");
          if (v && String(v).trim()) return String(v).trim();
          return "/api/chat";
        }

        function getUserId() {
          var existing = null;
          try {
            existing = localStorage.getItem("chatbot-userId");
          } catch (e) {}
          if (existing) return existing;
          var generated =
            "user_" + Math.random().toString(16).slice(2) + Date.now();
          try {
            localStorage.setItem("chatbot-userId", generated);
          } catch (e) {}
          return generated;
        }

        function finishClosePanel() {
          panel.style.display = "none";
          panel.classList.remove("chatbot-panel--open");
          if (backdrop) {
            backdrop.style.display = "none";
            backdrop.classList.remove("chatbot-backdrop--visible");
          }
        }

        function isPanelOpen() {
          return panel.classList.contains("chatbot-panel--open");
        }

        function openPanel() {
          if (backdrop) {
            backdrop.style.display = "block";
          }
          panel.style.display = "block";
          window.requestAnimationFrame(function () {
            window.requestAnimationFrame(function () {
              if (backdrop) backdrop.classList.add("chatbot-backdrop--visible");
              panel.classList.add("chatbot-panel--open");
              startWelcomeSequenceIfNeeded();
            });
          });
          window.setTimeout(function () {
            input.focus();
          }, 120);
        }

        function closePanel() {
          cancelWelcomeSequence();
          if (backdrop) backdrop.classList.remove("chatbot-backdrop--visible");
          panel.classList.remove("chatbot-panel--open");
          window.setTimeout(function () {
            finishClosePanel();
          }, 420);
        }

        fab.addEventListener("click", function () {
          fab.classList.remove("chatbot-fab--pop");
          void fab.offsetWidth;
          fab.classList.add("chatbot-fab--pop");
          if (isPanelOpen()) closePanel();
          else openPanel();
        });

        if (backdrop) {
          backdrop.addEventListener("click", function () {
            closePanel();
          });
        }

        if (closeBtn) {
          closeBtn.addEventListener("click", function () {
            closePanel();
          });
        }

        function getPageGreetingParts() {
          var path = "";
          try {
            path = window.location && window.location.pathname ? window.location.pathname : "";
          } catch (e) {
            path = "";
          }

          var lowerPath = String(path).toLowerCase();

          // Product pages look like: /productview/<product-slug>
          if (lowerPath.indexOf("/productview/") !== -1) {
            var slug = path.split("/productview/")[1] || "";
            slug = slug.split("/")[0] || "";
            slug = slug.split("?")[0] || "";
            slug = decodeURIComponent(slug);

            var pretty = String(slug).replace(/-/g, " ").trim();
            if (!pretty) pretty = "this product";
            pretty = pretty.charAt(0).toUpperCase() + pretty.slice(1);

            return [
              "Hi! I’m ScriptAI from MacStore Nepal.",
            ];
          }

          return [
            "Hi! I’m ScriptAI from MacStore Nepal.",
            "What’s your budget and usage (student, office, editing, or gaming)?",
          ];
        }

        function getPageGreeting() {
          return getPageGreetingParts().join(" ");
        }

        function getPageContext() {
          var path = "";
          try {
            path = window.location && window.location.pathname ? window.location.pathname : "";
          } catch (e) {
            path = "";
          }

          var lowerPath = String(path).toLowerCase();

          // Product pages look like: /productview/<product-slug>
          if (lowerPath.indexOf("/productview/") !== -1) {
            var slug = path.split("/productview/")[1] || "";
            slug = slug.split("/")[0] || "";
            slug = slug.split("?")[0] || "";
            slug = decodeURIComponent(slug);

            var pretty = String(slug).replace(/-/g, " ").trim();
            if (!pretty) pretty = "this product";
            pretty = pretty.charAt(0).toUpperCase() + pretty.slice(1);

            return {
              type: "product",
              slug: slug,
              name: pretty,
            };
          }

          return {
            type: "page",
            path: path,
          };
        }

        function send() {
          var text = (input.value || "").trim();
          if (!text) return;

          addMessage(text, "user");
          input.value = "";

          // Fast deterministic greeting (no AI call).
          var lower = String(text).toLowerCase();
          if (lower === "hi" || lower === "hello" || lower === "hey") {
            addMessage(
              getPageGreeting(),
              "bot"
            );
            input.focus();
            return;
          }

          var placeholder = addTypingIndicator();
          sendBtn.disabled = true;
          input.disabled = true;

          var userId = getUserId();
          var payload = { userId: userId, message: text, page: getPageContext() };

          var apiUrl = getChatApiUrl();

          var streamUrl = apiUrl + "/stream";
          var inner = placeholder.querySelector(".chatbot-msg-body");
          var userMessage = text;

          function wantsContact(userText) {
            var t = String(userText || "").toLowerCase();
            var keys = [
              "price",
              "cost",
              "available",
              "discount",
              "offer",
              "warranty",
              "delivery",
              "shipping",
              "return",
              "refund",
              "exchange",
            ];
            return keys.some(function (k) {
              return t.indexOf(k) !== -1;
            });
          }

          function cleanReplyForNoContact(userText, replyText) {
            if (wantsContact(userText)) return String(replyText || "");
            var cleaned = String(replyText || "");
            cleaned = cleaned.replace(/Please share[^.?!\n]*\n?/gi, "");
            cleaned = cleaned.replace(/share your name and contact[^.?!\n]*[.?!]?/gi, "");
            cleaned = cleaned.replace(/name and contact[^.?!\n]*[.?!]?/gi, "");
            cleaned = cleaned.replace(/latest price[^.?!\n]*[.?!]?/gi, "");
            cleaned = cleaned.replace(/latest price and offers[^.?!\n]*[.?!]?/gi, "");
            cleaned = cleaned.replace(/offers[^.?!\n]*[.?!]?/gi, "");
            cleaned = cleaned
              .split("\n")
              .filter(function (line) {
                return !/contact|name|latest price|offers/i.test(String(line || ""));
              })
              .join("\n")
              .trim();
            return cleaned || String(replyText || "");
          }

          function streamToText(response) {
            return new Promise(function (resolve, reject) {
              if (!response || !response.body || !response.body.getReader) {
                reject(new Error("No streaming body"));
                return;
              }

              var reader = response.body.getReader();
              var decoder = new TextDecoder();
              var fullText = "";
              var buffer = "";

              function pump() {
                reader
                  .read()
                  .then(function (chunk) {
                    if (!chunk) {
                      resolve(fullText);
                      return;
                    }
                    if (chunk.done) {
                      resolve(fullText);
                      return;
                    }

                    buffer += decoder.decode(chunk.value, { stream: true });
                    var lines = buffer.split("\n");
                    buffer = lines.pop();

                    lines.forEach(function (line) {
                      line = String(line || "").trim();
                      if (!line.startsWith("data:")) return;
                      var dataStr = line.slice(5).trim();
                      if (!dataStr || dataStr === "[DONE]") return;

                      try {
                        var json = JSON.parse(dataStr);
                        var choice = json && json.choices && json.choices[0];
                        var token =
                          choice &&
                          choice.delta &&
                          choice.delta.content
                            ? choice.delta.content
                            : "";

                        if (token) {
                          fullText += token;
                          if (inner) inner.innerHTML = linkifyText(fullText);
                        }
                      } catch (e) {}
                    });

                    pump();
                  })
                  .catch(reject);
              }

              pump();
            });
          }

          function tryJson() {
            return fetch(apiUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            })
              .then(function (r) {
                return r.text().then(function (t) {
                  var data = null;
                  try {
                    data = t ? JSON.parse(t) : null;
                  } catch (e) {
                    data = null;
                  }
                  return { ok: r.ok, status: r.status, data: data };
                });
              })
              .then(function (result) {
                var data = result && result.data;
                var reply;
                if (result && result.ok && data && data.success) {
                  reply = data.reply;
                } else if (data && data.error) {
                  reply = data.error;
                } else if (result && result.status === 404) {
                  reply =
                    "Chat API not found (404). Your live site is static: deploy Node (server.js) or set <meta name=\"macstore-chat-api\" content=\"https://YOUR-API-HOST/api/chat\"> and enable CORS on the API.";
                } else {
                  reply = "AI server error (HTTP " + (result && result.status) + ")";
                }

                if (inner)
                  inner.innerHTML = linkifyText(
                    cleanReplyForNoContact(userMessage, reply)
                  );
              });
          }

          fetch(streamUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          })
            .then(function (r) {
              if (!r.ok) throw new Error("Stream http " + r.status);
              return streamToText(r);
            })
            .then(function (fullText) {
              if (inner)
                inner.innerHTML = linkifyText(
                  cleanReplyForNoContact(userMessage, fullText)
                );
            })
            .catch(function () {
              // Fallback to non-stream response
              return tryJson().catch(function () {
                if (inner) inner.textContent = "AI server not responding";
              });
            })
            .finally(function () {
              sendBtn.disabled = false;
              input.disabled = false;
              input.focus();
            });
        }
        sendBtn.addEventListener("click", send);
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") send();
        });
        window.setTimeout(function () {
          if (!isPanelOpen()) openPanel();
        }, 3000);
      })();
    </script>
  </body>
</html>
